<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DUCH — El mundo cambió</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
/* =====================================================================
   DUCH TECHNOLOGIES — «El mundo cambió. ¿Y tu negocio?»
   Motor de animación determinista: renderFrame(t) dibuja el cuadro
   exacto del segundo t. Sin imágenes externas: todo es procedural.
   ===================================================================== */
const W = 1080, H = 1920, FPS = 30, DUR = 38;
const main = document.getElementById('c');
const M = main.getContext('2d');
const FD = '"Inter Display","Inter",sans-serif';
const FU = '"Inter",sans-serif';
const FS = '"Liberation Serif","DejaVu Serif",serif';

/* ---------- utilidades ---------- */
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  out3: x => 1 - Math.pow(1 - x, 3),
  out5: x => 1 - Math.pow(1 - x, 5),
  in3: x => x * x * x,
  inOut3: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }

/* ---------- sprites de luz ---------- */
function radial(size, stops) {
  const c = mk(size, size), x = c.getContext('2d');
  const g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => g.addColorStop(o, col)); x.fillStyle = g; x.fillRect(0, 0, size, size); return c;
}
const glowS = (r, g, b) => radial(256, [[0, `rgba(${r},${g},${b},1)`], [.16, `rgba(${r},${g},${b},.55)`], [.42, `rgba(${r},${g},${b},.16)`], [.72, `rgba(${r},${g},${b},.04)`], [1, `rgba(${r},${g},${b},0)`]]);
const bokehS = (r, g, b) => radial(128, [[0, `rgba(${r},${g},${b},.30)`], [.78, `rgba(${r},${g},${b},.38)`], [.9, `rgba(${r},${g},${b},.62)`], [.97, `rgba(${r},${g},${b},.2)`], [1, `rgba(${r},${g},${b},0)`]]);
const SP = { blue: glowS(30, 110, 255), cyan: glowS(0, 205, 255), white: glowS(255, 255, 255), warm: glowS(255, 170, 92), ice: glowS(165, 205, 255) };
const BK = { blue: bokehS(60, 130, 255), cyan: bokehS(80, 215, 255), white: bokehS(225, 236, 255), warm: bokehS(255, 186, 116) };
function glow(c, s, x, y, r, a, sx = 1, sy = 1) {
  if (a <= .002) return; c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = Math.min(1, a);
  c.drawImage(s, x - r * sx, y - r * sy, 2 * r * sx, 2 * r * sy); c.restore();
}

/* ---------- grano, viñeta, buffers ---------- */
const GR = [];
{ const R = rng(7); for (let k = 0; k < 8; k++) { const c = mk(540, 960), x = c.getContext('2d'); const id = x.createImageData(540, 960); for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (R() + R() + R() - 1.5) * 120; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } x.putImageData(id, 0, 0); GR.push(c); } }
const VIG = mk(W, H);
{ const x = VIG.getContext('2d'); x.translate(W / 2, H / 2); x.scale(1, H / W); const g = x.createRadialGradient(0, 0, W * .28, 0, 0, W * .8); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.55, 'rgba(0,0,0,.22)'); g.addColorStop(1, 'rgba(0,0,0,.88)'); x.fillStyle = g; x.fillRect(-W, -W, 2 * W, 2 * W); }
const BUF = mk(W, H), B = BUF.getContext('2d');
const LO = mk(360, 640), LX = LO.getContext('2d');          // capa desenfocada (1/3)
const LO2 = mk(270, 480), LX2 = LO2.getContext('2d');       // primer plano muy desenfocado
const HB = mk(90, 1920), HBX = HB.getContext('2d');         // blur horizontal (barrido)

/* ---------- silueta humana procedural ---------- */
function bodyPath(c, x, yf, h, ph, dir, o) {
  const bob = Math.abs(Math.cos(ph)) * h * .012, y0 = yf - bob;
  const hipY = y0 - h * .475, shY = y0 - h * .805, headY = y0 - h * .912, hr = h * .052, L = h * .245;
  const lw = h * .05;
  c.lineCap = 'round'; c.lineJoin = 'round';
  const leg = p => { const a = .42 * Math.sin(p), b = .55 * Math.max(0, Math.cos(p)); const kx = x + dir * Math.sin(a) * L, ky = hipY + Math.cos(a) * L; const fx = kx + dir * Math.sin(a - b) * L, fy = ky + Math.cos(a - b) * L; c.lineWidth = lw; c.beginPath(); c.moveTo(x, hipY); c.lineTo(kx, ky); c.lineTo(fx, fy); c.stroke(); c.lineWidth = lw * .9; c.beginPath(); c.moveTo(fx, fy); c.lineTo(fx + dir * h * .05, fy + h * .004); c.stroke(); };
  const arm = (p, phone) => { const sx = x, sy = shY + h * .02; let a1, a2; if (phone) { a1 = .25; a2 = 2.1; } else { a1 = -.36 * Math.sin(p); a2 = a1 + .25; } const ex = sx + dir * Math.sin(a1) * h * .17, ey = sy + Math.cos(a1) * h * .17; const hx = ex + dir * Math.sin(a2) * h * .16, hy = ey + Math.cos(a2) * h * .16; c.lineWidth = lw * .74; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.lineTo(hx, hy); c.stroke(); return [hx, hy]; };
  leg(ph + Math.PI); arm(ph, false);
  // torso
  c.beginPath();
  const coat = o.coat ? h * .2 : 0;
  c.moveTo(x - h * .06, shY + h * .012); c.quadraticCurveTo(x - h * .05, shY - h * .02, x, shY - h * .02); c.quadraticCurveTo(x + h * .05, shY - h * .02, x + h * .062, shY + h * .015);
  c.quadraticCurveTo(x + h * .066, (shY + hipY) / 2, x + h * .052 + coat * .2, hipY + coat); c.lineTo(x - h * .05 - coat * .2, hipY + coat); c.quadraticCurveTo(x - h * .066, (shY + hipY) / 2, x - h * .06, shY + h * .012); c.closePath(); c.fill();
  leg(ph);
  // cuello y cabeza
  c.lineWidth = h * .034; c.beginPath(); c.moveTo(x, shY); c.lineTo(x + dir * h * (o.phone ? .018 : .006), headY + hr * .6); c.stroke();
  const hx0 = x + dir * h * (o.phone ? .022 : .006), hy0 = headY + (o.phone ? h * .012 : 0);
  c.beginPath(); c.arc(hx0, hy0, hr, 0, Math.PI * 2); c.fill();
  if (o.hair) { c.beginPath(); c.ellipse(hx0 - dir * hr * .3, hy0 + hr * .4, hr * .7, hr * 1.1, 0, 0, Math.PI * 2); c.fill(); }
  if (o.bag) { c.fillRect(x + dir * h * .06, hipY - h * .02, h * .07, h * .09); }
  const hand = arm(ph + Math.PI, !!o.phone);
  return { hand, head: [hx0, hy0], hr };
}
function person(c, x, yf, h, ph, dir, o = {}) {
  c.save();
  if (o.rim) { c.globalAlpha = o.rimA ?? .55; c.strokeStyle = c.fillStyle = o.rim; c.save(); c.translate(o.rimDx ?? -2.5, -2); bodyPath(c, x, yf, h, ph, dir, o); c.restore(); c.globalAlpha = 1; }
  c.strokeStyle = c.fillStyle = o.col || '#010205';
  const r = bodyPath(c, x, yf, h, ph, dir, o);
  c.restore();
  if (o.phone) {
    const [hx, hy] = r.hand; const pw = h * .024, ph2 = h * .042;
    c.save(); c.translate(hx, hy - ph2 * .4); c.rotate(-dir * .35);
    c.fillStyle = '#d8e8ff'; c.globalAlpha = .95; rr(c, -pw / 2, -ph2 / 2, pw, ph2, pw * .2); c.fill(); c.restore();
    glow(c, SP.ice, hx, hy - ph2 * .4, h * .11, .85 * (o.phoneA ?? 1));
    glow(c, SP.blue, r.head[0] + dir * r.hr * .6, r.head[1] + r.hr * .2, h * .08, .55 * (o.phoneA ?? 1));
  }
}
function walker(c, w, t, camX = 0, o = {}) {
  const d = w.v * (t - (w.t0 || 0));
  const x = w.x0 + d * w.dir - camX * (w.depth || 1);
  const ph = (w.ph || 0) + 2 * Math.PI * d / (w.h * .95);
  person(c, x, w.yf, w.h, ph, w.dir, Object.assign({ phone: w.phone, coat: w.coat, bag: w.bag, hair: w.hair }, o));
}

/* ---------- tipografía cinematográfica ---------- */
function layoutLines(c, lines, size, weight) {
  const out = []; let maxW = 0;
  for (const ln of lines) {
    const words = ln.split(' ').map(w => ({ em: w.includes('*'), s: w.replace(/\*/g, '') }));
    let x = 0; for (const w of words) { c.font = `${w.em ? 500 : weight} ${size}px ${FD}`; w.w = c.measureText(w.s).width; w.x = x; x += w.w + size * .27; }
    const lw = x - size * .27; maxW = Math.max(maxW, lw); out.push({ words, w: lw });
  }
  return { out, maxW };
}
function drawCard(c, card, t) {
  const { t0, t1, lines, y, size = 62, weight = 300, lh = 1.24, stagger = .075 } = card;
  if (t < t0 - .01 || t > t1 + .02) return;
  let fs = size, L = layoutLines(c, lines, fs, weight);
  if (L.maxW > 930) { fs = size * 930 / L.maxW; L = layoutLines(c, lines, fs, weight); }
  const q = E.inOut3(P(t, t1 - .5, t1));
  // velo para legibilidad
  const a0 = E.out3(P(t, t0, t0 + .6)) * (1 - q);
  const vh = L.out.length * fs * lh;
  c.save(); c.globalAlpha = a0 * .55;
  const g = c.createLinearGradient(0, y - fs * 1.4, 0, y + vh + fs * .6);
  g.addColorStop(0, 'rgba(0,3,10,0)'); g.addColorStop(.35, 'rgba(0,3,10,.75)'); g.addColorStop(.7, 'rgba(0,3,10,.7)'); g.addColorStop(1, 'rgba(0,3,10,0)');
  c.fillStyle = g; c.fillRect(0, y - fs * 1.4, W, vh + fs * 2); c.restore();
  let i = 0;
  L.out.forEach((ln, li) => {
    const x0 = W / 2 - ln.w / 2, yy = y + li * fs * lh + fs * .78;
    for (const w of ln.words) {
      const ws = t0 + i * stagger; const p = E.out3(P(t, ws, ws + .85));
      const al = p * (1 - q); if (al > .003) {
        const bl = (1 - p) * 16 + q * 10, dy = (1 - p) * 26 - q * 16;
        c.save(); c.globalAlpha = al; if (bl > .35) c.filter = `blur(${bl.toFixed(1)}px)`;
        c.font = `${w.em ? 500 : weight} ${fs}px ${FD}`; c.textBaseline = 'alphabetic';
        c.shadowColor = 'rgba(0,0,0,.7)'; c.shadowBlur = 30;
        c.fillStyle = w.em ? '#69bfff' : '#eef3fa';
        c.fillText(w.s, x0 + w.x, yy + dy);
        if (w.em) { c.shadowColor = 'rgba(40,140,255,.9)'; c.shadowBlur = 26; c.globalCompositeOperation = 'lighter'; c.globalAlpha = al * .35; c.fillText(w.s, x0 + w.x, yy + dy); }
        c.restore();
      }
      i++;
    }
  });
}
function typed(c, s, x, y, t0, t1, tout, size = 26, col = 'rgba(205,220,240,.85)') {
  if (t < 0) return;
}
function superText(c, t, s, x, y, t0, tEnd) {
  if (t < t0 || t > tEnd) return;
  const n = Math.floor(clamp((t - t0) / (s.length * .045)) * s.length);
  const a = 1 - P(t, tEnd - .4, tEnd);
  c.save(); c.globalAlpha = a; c.font = `500 25px ${FU}`; c.letterSpacing = '5px'; c.fillStyle = 'rgba(214,226,244,.9)';
  c.shadowColor = 'rgba(0,0,0,.8)'; c.shadowBlur = 12;
  c.fillStyle = '#2f8cff'; c.fillRect(x, y - 22, 3, 30);
  c.fillStyle = 'rgba(214,226,244,.9)'; c.fillText(s.slice(0, n), x + 18, y);
  if (n < s.length && Math.floor(t * 6) % 2 === 0) c.fillRect(x + 18 + c.measureText(s.slice(0, n)).width + 4, y - 20, 12, 24);
  c.restore();
}

/* =====================================================================
   ESCENA 1A — LA CIUDAD (0 – 2.6 s)
   ===================================================================== */
function buildCityLayer(w, h, seed, o) {
  const c = mk(w, h), x = c.getContext('2d'); const R = rng(seed); let px = -20;
  while (px < w) {
    const bw = o.bw[0] + R() * (o.bw[1] - o.bw[0]), bh = o.bh[0] + R() * (o.bh[1] - o.bh[0]), top = h - bh;
    x.fillStyle = o.col; x.fillRect(px, top, bw + 1, bh);
    if (R() < .3) { x.fillRect(px + bw * (.2 + R() * .5), top - o.ant, 3, o.ant); }
    if (R() < .3) { x.fillRect(px + bw * .15, top - bh * .05, bw * .7, bh * .05 + 2); }
    x.fillStyle = o.rim; x.fillRect(px, top, bw, 2);
    const [ww, wh] = o.win, [gx, gy] = o.gap; const lit = o.lit * (.3 + R() * 1.1);
    for (let yy = top + gy * 2; yy < h - gy * 2; yy += wh + gy) for (let xx = px + gx; xx < px + bw - ww - gx; xx += ww + gx) {
      if (R() < lit) { const r = R(); x.fillStyle = r < .55 ? `rgba(110,165,255,${.22 + R() * .5})` : r < .85 ? `rgba(220,232,255,${.25 + R() * .5})` : `rgba(255,196,130,${.2 + R() * .35})`; x.fillRect(xx, yy, ww, wh); }
    }
    px += bw + o.sp * R();
  }
  return c;
}
const CITY = [
  buildCityLayer(2000, 1000, 11, { bw: [50, 150], bh: [280, 860], col: '#0a1630', rim: 'rgba(80,140,255,.25)', ant: 60, win: [3, 4], gap: [6, 7], lit: .28, sp: 6 }),
  buildCityLayer(2200, 1150, 23, { bw: [90, 220], bh: [380, 1050], col: '#050c1b', rim: 'rgba(70,120,230,.22)', ant: 90, win: [5, 7], gap: [9, 10], lit: .3, sp: 10 }),
  buildCityLayer(2400, 1100, 37, { bw: [150, 330], bh: [220, 640], col: '#010309', rim: 'rgba(60,110,220,.18)', ant: 120, win: [8, 11], gap: [15, 17], lit: .12, sp: 30 }),
];
const CITY_BOKEH = (() => { const R = rng(5), a = []; for (let i = 0; i < 12; i++) a.push({ x: R() * W, y: 1300 + R() * 650, r: 40 + R() * 110, k: ['blue', 'white', 'warm', 'cyan'][Math.floor(R() * 4)], v: (R() - .5) * 30, a: .12 + R() * .2 }); return a; })();
const STARS = (() => { const R = rng(91), a = []; for (let i = 0; i < 70; i++) a.push([R() * W, R() * 700, R() * 1.4 + .3, R()]); return a; })();

function sCity(c, t) {
  const p = P(t, 0, 2.7), z = 1 + .13 * E.inOutSine(p);
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#010208'); g.addColorStop(.45, '#030a1c'); g.addColorStop(.66, '#0a2150'); g.addColorStop(.76, '#04091a'); g.addColorStop(1, '#000');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  for (const [x, y, r, k] of STARS) { c.fillStyle = `rgba(200,220,255,${.25 + .35 * Math.sin(t * 3 + k * 20) ** 2})`; c.fillRect(x, y, r, r); }
  const Gy = 1470;
  const layer = (img, s, k, yo) => {
    const zz = 1 + (z - 1) * k; c.save(); c.translate(540, 1050); c.scale(zz, zz); c.translate(-540 + Math.sin(t * .4) * 8 * k - 30 * p * k, -1050 - 40 * p * k);
    const w = img.width * s, h = img.height * s; c.drawImage(img, 540 - w / 2, Gy + yo - h, w, h); c.restore();
  };
  layer(CITY[0], .72, .35, -40);
  glow(c, SP.blue, 540, 1330, 1100, .45, 1.1, .3);
  glow(c, SP.white, 300 + t * 30, 1360, 900, .05, 1.6, .12);
  layer(CITY[1], .78, .75, 0);
  glow(c, SP.blue, 540, 1440, 900, .22, 1.3, .18);
  layer(CITY[2], .82, 1.25, 30);
  // avenida: estelas de luz
  c.save(); c.translate(540, 1050); c.scale(1 + (z - 1) * 1.4, 1 + (z - 1) * 1.4); c.translate(-540, -1050);
  c.fillStyle = '#000'; c.fillRect(-200, Gy + 28, W + 400, 700);
  const R = rng(3);
  for (let i = 0; i < 16; i++) {
    const dir = i % 2 ? 1 : -1, v = 260 + R() * 260, y = Gy + 48 + (i % 4) * 14 + R() * 6;
    const x = ((R() * 2000 + dir * v * t) % 2000 + 2000) % 2000 - 460;
    glow(c, dir > 0 ? SP.white : SP.warm, x, y, 26, .7, 7, .35); glow(c, dir > 0 ? SP.ice : SP.warm, x, y, 60, .15, 3, .5);
    glow(c, dir > 0 ? SP.ice : SP.warm, x, y + 70, 40, .08, 4, 1.4);
  }
  c.restore();
  for (const b of CITY_BOKEH) { const s = 1 + (z - 1) * 2; c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = b.a; const r = b.r * s; c.drawImage(BK[b.k], (b.x + b.v * t - 540) * s + 540 - r, (b.y - 1050) * s + 1050 - r, r * 2, r * 2); c.restore(); }
  // exposición desde negro
  c.fillStyle = `rgba(0,0,0,${1 - E.out3(P(t, .05, 1.6))})`; c.fillRect(0, 0, W, H);
}

/* =====================================================================
   ESCENA 1B — LA CALLE (2.3 – 5.2 s)
   ===================================================================== */
const STREET_SHOPS = [
  { x: -260, w: 300, col: [255, 186, 120], k: 'warm' }, { x: 120, w: 280, col: [120, 175, 255], k: 'blue' },
  { x: 470, w: 330, shutter: true, col: [255, 196, 130], k: 'warm' }, { x: 880, w: 290, col: [200, 225, 255], k: 'white' },
  { x: 1240, w: 300, col: [80, 200, 255], k: 'cyan' },
];
const STREET_PEOPLE = [
  { x0: -80, dir: 1, v: 150, h: 640, yf: 1720, phone: true, ph: 0 }, { x0: 860, dir: -1, v: 125, h: 610, yf: 1690, phone: true, ph: 1, hair: true },
  { x0: 280, dir: 1, v: 105, h: 570, yf: 1655, ph: 2, bag: true }, { x0: 1260, dir: -1, v: 175, h: 680, yf: 1745, phone: true, ph: 3, coat: true },
  { x0: 640, dir: -1, v: 55, h: 545, yf: 1630, phone: true, ph: 4 }, { x0: -420, dir: 1, v: 210, h: 720, yf: 1780, ph: 5, coat: true },
  { x0: 1500, dir: -1, v: 140, h: 600, yf: 1700, phone: true, ph: 2.4 },
];
function sStreet(c, t) {
  const lt = t - 2.3, camX = -60 + 70 * lt;
  // fondo desenfocado a baja resolución
  const x = LX; x.setTransform(1, 0, 0, 1, 0, 0);
  const g = x.createLinearGradient(0, 0, 0, 640); g.addColorStop(0, '#02050d'); g.addColorStop(.5, '#060d1d'); g.addColorStop(.72, '#03060d'); g.addColorStop(1, '#010204');
  x.fillStyle = g; x.fillRect(0, 0, 360, 640);
  x.scale(1 / 3, 1 / 3);
  x.translate(-camX * .45, 0);
  x.fillStyle = '#070c19'; x.fillRect(-600, 360, 2600, 1000);
  for (let i = 0; i < 14; i++) { x.fillStyle = 'rgba(120,160,230,.08)'; x.fillRect(-500 + i * 190, 420, 70, 110); }
  for (const s of STREET_SHOPS) {
    const [r, gg, b] = s.col; let open = 1;
    if (s.shutter) open = E.inOut3(P(t, 2.55, 4.4));
    const wg = x.createRadialGradient(s.x + s.w / 2, 940, 10, s.x + s.w / 2, 1040, s.w * .95); wg.addColorStop(0, `rgba(${r},${gg},${b},.95)`); wg.addColorStop(.6, `rgba(${r * .6 | 0},${gg * .6 | 0},${b * .6 | 0},.6)`); wg.addColorStop(1, `rgba(${r * .25 | 0},${gg * .25 | 0},${b * .3 | 0},.5)`);
    x.fillStyle = wg; x.fillRect(s.x, 900, s.w, 420);
    x.fillStyle = 'rgba(0,0,0,.45)'; x.fillRect(s.x + s.w / 2 - 6, 900, 12, 420); x.fillRect(s.x, 1240, s.w, 10);

    const mg = c.createLinearGradient(-150, -150, 200, 150); mg.addColorStop(0, '#ffffff'); mg.addColorStop(.45, '#c9d4e3'); mg.addColorStop(.7, '#8b9db8'); mg.addColorStop(1, '#e8eef7');

  const ln = E.inOut3(P(lt, 2.5, 3.1));

  c.restore();
  drawCard(c, { t0: 35.0, t1: 39, lines: ['El futuro no espera.'], y: 1240, size: 74, weight: 300, stagger: .12 }, t);

  c.fillStyle = `rgba(0,0,0,${E.inOut3(P(t, 37.35, 38))})`; c.fillRect(0, 0, W, H);
}

/* =====================================================================
   MONTAJE
   ===================================================================== */
const CARDS = [
  { t0: .3, t1: 2.3, lines: ['El mundo cambió…'], y: 820, size: 92, weight: 300, stagger: .16 },
  { t0: 2.8, t1: 4.9, lines: ['Pero no todos los negocios', '*cambiaron* con él.'], y: 640, size: 64 },
  { t0: 5.45, t1: 8.9, lines: ['Hoy, antes de comprar,', 'las personas *buscan*,', '*comparan*…'], y: 200, size: 62, stagger: .14 },
  { t0: 9.05, t1: 12.78, lines: ['y *descubren* nuevas', 'oportunidades', 'desde una pantalla.'], y: 200, size: 62, stagger: .12 },
  { t0: 14.1, t1: 17.95, lines: ['La tecnología no reemplazó', 'los *buenos* *negocios*.'], y: 250, size: 62, stagger: .1 },
  { t0: 18.3, t1: 22.75, lines: ['Cambió la manera en que', 'el mundo puede *encontrarlos*.'], y: 250, size: 62, stagger: .1 },
  { t0: 23.7, t1: 27.7, lines: ['Porque tener algo bueno', 'que ofrecer es importante.'], y: 270, size: 64, stagger: .1 },
  { t0: 28.05, t1: 31.75, lines: ['Pero permitir que las personas', 'lo *descubran*', 'también lo es.'], y: 250, size: 64, stagger: .11 },
];
function hblur(src, k) { // desenfoque de movimiento horizontal barato
  HBX.clearRect(0, 0, HB.width, HB.height); const w = Math.max(8, Math.round(W / k)); HBX.drawImage(src, 0, 0, w, H); return [HB, w];
}
const SCENES = [
  { f: sCity, a: 0, b: 2.62, comp: t => { const q = P(t, 2.2, 2.6); return { alpha: 1, dx: -E.in3(q) * 55, zoom: 1 + .12 * E.in3(q), mb: E.in3(q) * 1.4 }; } },
  { f: sStreet, a: 2.36, b: 5.08, comp: t => { const q = P(t, 2.36, 2.72); return { alpha: E.out3(P(t, 2.36, 2.52)), dx: (1 - E.out3(q)) * 55, zoom: 1 + .12 * (1 - E.out3(q)), mb: (1 - E.out3(q)) * 1.4, fade: 1 - P(t, 4.88, 5.06) }; } },
  { f: sShopA, a: 5.0, b: 9.05, comp: t => ({ alpha: E.out3(P(t, 5.0, 5.35)) }) },
  { f: sSign, a: 8.98, b: 10.8, comp: t => ({ alpha: P(t, 8.98, 9.08) }) },
  { f: sShopB, a: 10.55, b: 12.9, comp: t => ({ alpha: E.inOut3(P(t, 10.55, 10.8)) }) },
  { f: sDigital, a: 12.88, b: 23.3, comp: t => { const q = E.in3(P(t, 22.85, 23.28)); return { alpha: 1 - q * .9, zoom: 1 + q * 1.6, fy: 1185 }; } },
  { f: sNet, a: 22.95, b: 32.0, comp: t => { const q = E.out3(P(t, 22.95, 23.4)); return { alpha: q, zoom: .78 + .22 * q }; } },
  { f: sBrand, a: 32.0, b: 38.01, comp: () => ({ alpha: 1 }) },
];
function renderFrame(t) {
  M.setTransform(1, 0, 0, 1, 0, 0); M.globalAlpha = 1; M.globalCompositeOperation = 'source-over'; M.filter = 'none';
  M.fillStyle = '#000'; M.fillRect(0, 0, W, H);
  for (const s of SCENES) {
    if (t < s.a || t >= s.b) continue;
    B.setTransform(1, 0, 0, 1, 0, 0); B.globalAlpha = 1; B.globalCompositeOperation = 'source-over'; B.filter = 'none'; B.letterSpacing = '0px'; B.textAlign = 'left';
    s.f(B, t);
    const k = s.comp ? s.comp(t) : { alpha: 1 };
    const a = (k.alpha ?? 1) * (k.fade ?? 1); if (a <= 0) continue;
    M.save(); M.globalAlpha = clamp(a);
    if (k.zoom) { const fy = k.fy || 960; M.translate(540, fy); M.scale(k.zoom, k.zoom); M.translate(-540, -fy); }
    if (k.mb > .02) { const [img, w] = hblur(BUF, 1 + k.mb * 30); M.drawImage(img, 0, 0, w, H, k.dx || 0, 0, W, H); }
    else M.drawImage(BUF, k.dx || 0, 0);

  }

  fl(2.45, .2, .35, SP.ice); fl(13.32, .35, .55, SP.blue); fl(23.08, .25, .7, SP.ice); fl(32.02, .3, .4, SP.blue);
